<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xiaozhi IoT 控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr">
      <h1>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
        Xiaozhi IoT 即時監控
      </h1>
      <span class="badge" id="st_mode">讀取中...</span>
    </div>

    <div class="env-grid">
      <div class="env-box">
        <div class="k">環境溫度</div>
        <div class="num" id="st_temp">--</div>
      </div>
      <div class="env-box">
        <div class="k">相對濕度</div>
        <div class="num" id="st_humi">--</div>
      </div>
      <div class="env-box">
        <div class="k">環境照度</div>
        <div class="num" id="st_lux">--</div>
      </div>
    </div>

    <div class="grid">
      <div class="stat"><div class="k">Wi-Fi 狀態</div><div class="v" id="st_wifi">--</div></div>
      <div class="stat"><div class="k">目標熱點 SSID</div><div class="v" id="st_ssid">--</div></div>
      <div class="stat"><div class="k">EEPROM 離線暫存</div><div class="v" id="st_eeprom">--</div></div>
      <div class="stat"><div class="k">SD 卡儲存狀態</div><div class="v" id="st_sd">--</div></div>
    </div>
  </div>

  <div class="card">
    <div class="hdr">
      <h2>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="8" cy="12" r="2"/></svg>
        連線開關與遠端遙控
      </h2>
      <span class="sub-tag" id="st_vol">音量 --</span>
    </div>

    <div class="sw-list">
      <label class="sw-row" for="sw_wifi">
        <div>
          <div class="sw-title">區網 Wi-Fi</div>
          <div class="sw-desc">關閉將中斷熱點與區域網路連線</div>
        </div>
        <input id="sw_wifi" type="checkbox" class="toggle">
      </label>
      <label class="sw-row" for="sw_cloud">
        <div>
          <div class="sw-title">雲端伺服器連線</div>
          <div class="sw-desc">啟用即時感測上傳與雲端語音對話</div>
        </div>
        <input id="sw_cloud" type="checkbox" class="toggle">
      </label>
    </div>

    <div class="ctrl-grid">
      <button type="button" class="ctrl-btn" data-cmd="vol_down">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="12" x2="16" y2="12"/></svg>
        音量 -
      </button>
      <button type="button" class="ctrl-btn" data-cmd="vol_up">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="19" y1="9" x2="19" y2="15"/><line x1="16" y1="12" x2="22" y2="12"/></svg>
        音量 +
      </button>
      <button type="button" class="ctrl-btn" id="btn_mute" data-cmd="mute_toggle">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        靜音
      </button>
      <button type="button" class="ctrl-btn" id="btn_music" data-cmd="music_toggle">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        播放音樂
      </button>
      <button type="button" class="ctrl-btn span2" id="btn_speak" data-cmd="speak_env">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        語音播報環境
      </button>
    </div>
  </div>

  <div class="card">
    <div class="hdr"><h2>網路與系統參數設定</h2></div>
    <div id="msg" class="msg"></div>
    <form id="cfgForm" method="POST" action="/save">
      <div class="field">
        <label for="wifi_ssid">Wi-Fi SSID（最多 31 字元）</label>
        <input id="wifi_ssid" name="wifi_ssid" maxlength="31" placeholder="輸入路由器名稱">
      </div>
      <div class="field">
        <label for="wifi_pass">Wi-Fi 密碼（8~63 字元，留空則不修改）</label>
        <input id="wifi_pass" type="password" name="wifi_pass" maxlength="63" placeholder="留空維持原密碼">
      </div>
      <div class="field">
        <label for="server_url">雲端伺服器 URL（http/https/ws/wss）</label>
        <input id="server_url" name="server_url" maxlength="127" placeholder="http://192.168.1.100:8080">
      </div>
      <div class="row2">
        <div class="field">
          <label for="sample_interval_sec">採樣週期（5~3600 秒）</label>
          <input id="sample_interval_sec" type="number" name="sample_interval_sec" min="5" max="3600" required>
        </div>
        <div class="field">
          <label for="psram_window_hours">PSRAM 統計視窗（1~24 小時）</label>
          <input id="psram_window_hours" type="number" name="psram_window_hours" min="1" max="24" required>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="eeprom_warn_pct">EEPROM 警告門檻（50~95 %）</label>
          <input id="eeprom_warn_pct" type="number" name="eeprom_warn_pct" min="50" max="95" required>
        </div>
        <div class="field">
          <label for="sd_warn_free_mb">SD 卡剩餘警告（50~1000 MB）</label>
          <input id="sd_warn_free_mb" type="number" name="sd_warn_free_mb" min="50" max="1000" required>
        </div>
      </div>
      <button type="submit" class="btn">儲存設定至 NVS</button>
    </form>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
